# Include in nginx's http context, once. Replace hostname and certificate paths.
limit_conn_zone $server_name zone=hermes_alexa_connections:1m;
limit_req_zone $server_name zone=hermes_alexa_rate:1m rate=4r/s;

server {
    listen 443 ssl;
    server_name alexa.example.org;
    ssl_certificate     /etc/letsencrypt/live/alexa.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexa.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 32k;
    client_body_buffer_size 32k;
    client_header_timeout 5s;
    client_body_timeout 3s;
    send_timeout 5s;
    keepalive_timeout 0;

    location = /alexa {
        if ($host != alexa.example.org) { return 404; }
        if ($request_uri != /alexa) { return 404; }
        if ($request_method != POST) { return 405; }
        limit_conn hermes_alexa_connections 4;
        limit_req zone=hermes_alexa_rate burst=4 nodelay;
        limit_conn_status 429;
        limit_req_status 429;
        proxy_request_buffering on;
        proxy_http_version 1.1;
        proxy_set_header Connection close;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_connect_timeout 1s;
        proxy_send_timeout 3s;
        proxy_read_timeout 6s;
        proxy_next_upstream off;
        proxy_pass http://127.0.0.1:8765;
    }

    location / { return 404; }
}
